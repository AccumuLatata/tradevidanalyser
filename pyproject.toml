[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradevidanalyser"
version = "0.1.0"
description = "Headless session-tape analyser: German OBS recordings → cited insights for Grok."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Accumu" }]
keywords = ["trading", "asr", "session-review", "futures"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "tzdata>=2024.1",
    "httpx>=0.27,<1",
    "pyarrow>=16,<23",
    "duckdb>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.16,<0.17",
    "httpx>=0.27,<1",
]
whisperx = [
    "whisperx",
    "torch",
]
ocr = [
    "paddleocr>=2.7,<4",
]
journal = [
    "thesistester @ git+https://github.com/AccumuLatata/ThesisTester.git",
]

[project.scripts]
tva = "tradevidanalyser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradevidanalyser = ["layout.yaml", "rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: requires TVA_ROOT/fixtures/golden (NAS excerpt; skipped if absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
