# Screen layout ROIs for TVA3 (frames / OCR / redaction).
#
# How to fill this file (desk, after PR-12):
#   1. Ingest a real session and run:  tva frames <id> --contact-sheet
#   2. Open sessions/<id>/frames/contact_sheet.jpg (stays under TVA_ROOT).
#   3. Measure each panel as a fraction of the frame: x, y, w, h in 0..1
#      from the top-left (x=0,y=0). One layout then survives 1080p / 1440p.
#   4. Put those numbers on the matching roi below. Leave unused rois at 0.
#
# Required roi names (per layout_id): clock, position, pnl, instrument,
# account_mask, balance_mask. Names ending in _mask are account / balance
# regions. PR-14 redact.py black-boxes those before a frame leaves the
# machine. Until then, raw JPEGs must stay under TVA_ROOT — never git, never
# a hosted upload, never TVA_SERVE_MEDIA.
#
# Coordinates are normalised {x, y, w, h}. Values must be in 0..1.
# PR-13 `tva ocr` crops clock / position / pnl / instrument (skips w=h=0 and
# *_mask). parsed: ISO datetime for clock, signed float for pnl, int for
# position, null for instrument / low confidence. Fake OCR is the default.
schema_version: "1"
layouts:
  quantower_default:
    description: "Trading PC, Quantower main chart, clock bottom-right"
    rois:
      clock:        {x: 0.90, y: 0.96, w: 0.09, h: 0.03}
      position:     {x: 0.00, y: 0.00, w: 0.00, h: 0.00}   # fill from the contact sheet
      pnl:          {x: 0.00, y: 0.00, w: 0.00, h: 0.00}
      instrument:   {x: 0.00, y: 0.00, w: 0.00, h: 0.00}
      account_mask: {x: 0.00, y: 0.00, w: 0.00, h: 0.00}
      balance_mask: {x: 0.00, y: 0.00, w: 0.00, h: 0.00}
