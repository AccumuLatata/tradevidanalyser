# JX0-A1 schema block (TT 4fc4af05). Effective 2026-11-02 (D11).
# notion_url is null in this copy (no real IDs in git). Parity compares
# tag_grammar + registries minus URLs to ThesisTester's bundled map.
tag_grammar:
  amendment: JX0-A1-2026-10-26
  charset: "^[A-Za-z0-9_]+$"
  effective_from: "2026-11-02"            # D11
  reserved_prefixes: [PB_, E_, V_, T_, C_, X_]   # X_ retired (D14): no valid values
  cardinality:
    PB_: "1"
    E_: "1"                               # D12 mandatory
    V_: "0..1"
    T_: "0..1"                            # D22
  entry_values: [E_agg, E_kon]
  confluence_none: C_none                 # the only valid C_ token
  qualifiers: [_retest, _naked, _break]   # D23 (fade = no suffix)
  direction_source: topstepx_fill_side    # D16: never from a tag
  variant_families:                       # enumerated variants; SFP+FA = FA (D3)
    V_FR: FR
    V_SFP: FA
    V_FA: FA
    V_MOM: MOM                            # PROPOSED P8 spellings
    V_H2: H2
    V_BO: BO
    V_RE: RE
    V_RR: RR
    V_TB: TB
  variant_patterns:
    ma_pair: "^V_(1m|5m|30m)([0-9]+)(EMA|SMA)x([0-9]+)(EMA|SMA)$"   # D21
  legacy_nonconforming_context: [ITR-C, CTR-R]
  control_tags:                           # D20; spelling PROPOSED P12 (alt. R_reentry)
    reentry: inherit_previous_trade
  dropped_tags: [countertrend]            # D19: never a valid tag

