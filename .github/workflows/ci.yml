name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  journal:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TT_DEPLOY_KEY }}
      - name: Install ThesisTester
        run: pip install "thesistester @ git+ssh://git@github.com/AccumuLatata/ThesisTester.git@d32f6d3"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Import ThesisTester journal modules
        run: python -c "import thesistester.journal.lock, thesistester.journal.positions"
      - name: Journal tests (fail if any skip)
        run: |
          set -euo pipefail
          pytest -q -rs tests/test_tt_journal.py tests/test_week_manifest.py tests/test_fills.py \
            | tee "${RUNNER_TEMP}/journal-pytest.txt"
          if grep -E '[[:space:]][0-9]+ skipped' "${RUNNER_TEMP}/journal-pytest.txt"; then
            echo "journal job forbids skipped tests" >&2
            exit 1
          fi
